[workspace]
resolver = "3"
members = ["crates/sim", "crates/client", "crates/tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# Отладочная сборка: свой код почти без оптимизации (быстро компилируется),
# зависимости с полной оптимизацией (игра остаётся играбельной).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
